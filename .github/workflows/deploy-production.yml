name: Deploy Production

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Make scripts executable
        run: |
          chmod +x backend/mvnw
          chmod +x ops/create-deploy-bundle.sh
          chmod +x ops/deploy-production-release.sh

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw test

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Create deploy bundle
        run: bash ops/create-deploy-bundle.sh

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload deploy bundle
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p /tmp/serendipity-deploy"
          scp -P "$SSH_PORT" deploy-bundle.tgz "$SSH_USER@$SSH_HOST:/tmp/serendipity-deploy/deploy-bundle.tgz"

      - name: Run remote deploy
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            mkdir -p /tmp/serendipity-deploy/extracted &&
            tar -xzf /tmp/serendipity-deploy/deploy-bundle.tgz -C /tmp/serendipity-deploy/extracted ops/deploy-production-release.sh &&
            bash /tmp/serendipity-deploy/extracted/ops/deploy-production-release.sh /tmp/serendipity-deploy/deploy-bundle.tgz
          "
