server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/serendipity_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-change-before-prod-1234567890}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:36000000}
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
    codice-fiscale: ${APP_BOOTSTRAP_ADMIN_CODICE_FISCALE:}
    nome: ${APP_BOOTSTRAP_ADMIN_NOME:}
    cognome: ${APP_BOOTSTRAP_ADMIN_COGNOME:}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
