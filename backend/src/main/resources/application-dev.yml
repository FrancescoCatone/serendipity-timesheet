server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/serendipity_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
      mail.smtp.ssl.enable: ${MAIL_SMTP_SSL_ENABLE:false}
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    mail:
      enabled: false

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:development}
  release: ${SENTRY_RELEASE:}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  send-default-pii: false

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-change-before-prod-1234567890}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
    codice-fiscale: ${APP_BOOTSTRAP_ADMIN_CODICE_FISCALE:}
    nome: ${APP_BOOTSTRAP_ADMIN_NOME:}
    cognome: ${APP_BOOTSTRAP_ADMIN_COGNOME:}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  notifications:
    enabled: ${APP_NOTIFICATIONS_ENABLED:false}
    recipient-email: ${APP_NOTIFICATIONS_RECIPIENT_EMAIL:${APP_BOOTSTRAP_ADMIN_EMAIL:}}
    from-email: ${APP_NOTIFICATIONS_FROM_EMAIL:${MAIL_USERNAME:noreply@serendipitycoop.it}}
    subject-prefix: ${APP_NOTIFICATIONS_SUBJECT_PREFIX:Serendipity}
