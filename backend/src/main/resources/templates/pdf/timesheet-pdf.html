<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="'Timesheet - ' + ${ts.utenteNomeCompleto}"></title>
    <style>
        @page {
            margin: 9mm 10mm 12mm;
        }

        body {
            margin: 0;
            font-family: sans-serif;
            font-size: 10px;
            line-height: 1.25;
            color: #000;
        }

        .page-content {
            position: relative;
            min-height: 255mm;
        }

        .header-main {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 2.5mm;
            border-bottom: 1px solid #ccc;
            padding-bottom: 1mm;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid #aaa;
            padding: 6px 5px;
            vertical-align: middle;
        }

        th {
            background: #f0f0f0;
            text-align: left;
            font-size: 9px;
            text-transform: uppercase;
            padding-top: 7px;
            padding-bottom: 7px;
        }

        tr {
            page-break-inside: avoid;
        }

        tfoot td {
            font-weight: bold;
            background: #fafafa;
            text-transform: uppercase;
        }

        .right {
            text-align: right;
        }

        .center {
            text-align: center;
        }

        .col-cliente {
            width: 35%;
        }

        .col-data {
            width: 12%;
        }

        .col-ore {
            width: 8%;
        }

        .col-min {
            width: 8%;
        }

        .col-orario {
            width: 15%;
        }

        .col-costo {
            width: 22%;
        }

        .festivo-row td {
            background: #fff4e5;
        }

        .festivo-badge {
            display: inline-block;
            margin-left: 4px;
            padding: 1px 5px;
            border-radius: 999px;
            background: #f59e0b;
            color: #fff;
            font-size: 8px;
            font-weight: bold;
            vertical-align: middle;
        }

        .footer-logo {
            position: absolute;
            right: 8mm;
            bottom: -4mm;
            text-align: right;
        }

        .footer-logo img {
            width: 34mm;
            opacity: 0.12;
        }
    </style>
</head>
<body>
<div class="page-content">
    <div class="header-main">
        <span th:text="${ts.utenteNomeCompleto}"></span>
        &nbsp;&#183;&nbsp;
        <span th:text="${ts.meseNome} + ' ' + ${ts.anno}"></span>
        &nbsp;&#183;&nbsp;
        Generato il <span th:text="${#temporals.format(ts.dataGenerazione, 'dd/MM/yyyy HH:mm')}"></span>
    </div>

    <table>
        <thead>
        <tr>
            <th class="col-cliente">CLIENTE</th>
            <th class="col-data center">DATA</th>
            <th class="col-ore center">ORE</th>
            <th class="col-min center">MIN</th>
            <th class="col-orario right">ORARIO (H)</th>
            <th class="col-costo right">COSTO (&#8364;)</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="r : ${ts.righe}" th:classappend="${r.festivo} ? 'festivo-row' : ''">
            <td>
                <span th:text="${r.clienteNome}"></span>
                <span th:if="${r.festivo}" class="festivo-badge">Festivo</span>
            </td>
            <td class="center" th:text="${#temporals.format(r.data, 'dd/MM/yyyy')}"></td>
            <td class="center" th:text="${r.ore}"></td>
            <td class="center" th:text="${r.minuti}"></td>
            <td class="right" th:text="${#numbers.formatDecimal(r.orario, 1, 2, 'COMMA')}"></td>
            <td class="right" th:text="${#numbers.formatDecimal(r.costoOrario, 1, 2, 'COMMA')}"></td>
        </tr>
        </tbody>

        <tfoot>
        <tr>
            <td colspan="4" class="right">TOTALI</td>
            <td class="right" th:text="${#numbers.formatDecimal(ts.totaleOrario, 1, 2, 'COMMA')}"></td>
            <td class="right" th:text="${#numbers.formatDecimal(ts.totaleCosto, 1, 2, 'COMMA')}"></td>
        </tr>
        </tfoot>
    </table>

    <div class="footer-logo" th:if="${logoDataUri != null}">
        <img th:src="${logoDataUri}" alt="Logo Serendipity"/>
    </div>
</div>
</body>
</html>
