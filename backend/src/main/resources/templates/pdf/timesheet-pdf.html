<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="'Timesheet - ' + ${ts.utenteNomeCompleto}"></title>
    <style>
        @page {
            margin: 14mm 10mm 12mm;
        }

        body {
            font-family: sans-serif;
            font-size: 10px;
            line-height: 1.25;
            color: #000;
        }

        /* Header principale (stile ex titolo Timesheet) */
        .header-main {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 4mm;
            border-bottom: 1px solid #ccc;
            padding-bottom: 1.5mm;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid #aaa;
            padding: 6px 5px;
            vertical-align: middle;
        }

        th {
            background: #f0f0f0;
            text-align: left;
            font-size: 9px;
            padding-top: 7px;
            padding-bottom: 7px;
        }

        tr {
            page-break-inside: avoid;
        }

        tfoot td {
            font-weight: bold;
            background: #fafafa;
        }

        .right {
            text-align: right;
        }

        .center {
            text-align: center;
        }

        .col-cliente {
            width: 35%;
        }

        .col-data {
            width: 12%;
        }

        .col-ore {
            width: 8%;
        }

        .col-min {
            width: 8%;
        }

        .col-orario {
            width: 15%;
        }

        .col-costo {
            width: 22%;
        }

        .festivo-row td {
            background: #fff4e5;
        }

        .festivo-badge {
            display: inline-block;
            margin-left: 4px;
            padding: 1px 5px;
            border-radius: 999px;
            background: #f59e0b;
            color: #fff;
            font-size: 8px;
            font-weight: bold;
            vertical-align: middle;
        }
    </style>

</head>
<body>

<!-- Header compatto -->
<div class="header-main">
    <span th:text="${ts.utenteNomeCompleto}"></span>
    &nbsp;·&nbsp;
    <span th:text="${ts.meseNome} + ' ' + ${ts.anno}"></span>
    &nbsp;·&nbsp;
    Generato il <span th:text="${#temporals.format(ts.dataGenerazione, 'dd/MM/yyyy HH:mm')}"></span>
</div>

<!-- Tabella -->
<table>
    <thead>
    <tr>
        <th class="col-cliente">CLIENTE</th>
        <th class="col-data center">DATA</th>
        <th class="col-ore center">ORE</th>
        <th class="col-min center">MIN</th>
        <th class="col-orario right">ORARIO (h)</th>
        <th class="col-costo right">COSTO (€)</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="r : ${ts.righe}" th:classappend="${r.festivo} ? 'festivo-row' : ''">
        <td>
            <span th:text="${r.clienteNome}"></span>
            <span th:if="${r.festivo}" class="festivo-badge">Festivo</span>
        </td>
        <td class="center" th:text="${#temporals.format(r.data, 'dd/MM/yyyy')}"></td>
        <td class="center" th:text="${r.ore}"></td>
        <td class="center" th:text="${r.minuti}"></td>
        <td class="right"
            th:text="${#numbers.formatDecimal(r.orario, 1, 2, 'COMMA')}"></td>
        <td class="right"
            th:text="${#numbers.formatDecimal(r.costoOrario, 1, 2, 'COMMA')}"></td>
    </tr>
    </tbody>

    <tfoot>
    <tr>
        <td colspan="4" class="right">TOTALI</td>
        <td class="right" th:text="${#numbers.formatDecimal(ts.totaleOrario, 1, 2, 'COMMA')}"></td>
        <td class="right" th:text="${#numbers.formatDecimal(ts.totaleCosto, 1, 2, 'COMMA')}"></td>
    </tr>
    </tfoot>
</table>

</body>
</html>
