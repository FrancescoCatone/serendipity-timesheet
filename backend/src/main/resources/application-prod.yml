server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
      mail.smtp.ssl.enable: ${MAIL_SMTP_SSL_ENABLE:false}
  flyway:
    enabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false

logging:
  level:
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    mail:
      enabled: false

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  release: ${SENTRY_RELEASE:}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  send-default-pii: false

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    allowed-origins: ${APP_ALLOWED_ORIGINS:https://www.serendipity.it,https://serendipity.it}
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
    codice-fiscale: ${APP_BOOTSTRAP_ADMIN_CODICE_FISCALE:}
    nome: ${APP_BOOTSTRAP_ADMIN_NOME:}
    cognome: ${APP_BOOTSTRAP_ADMIN_COGNOME:}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  notifications:
    enabled: ${APP_NOTIFICATIONS_ENABLED:false}
    recipient-email: ${APP_NOTIFICATIONS_RECIPIENT_EMAIL:${APP_BOOTSTRAP_ADMIN_EMAIL:}}
    from-email: ${APP_NOTIFICATIONS_FROM_EMAIL:${MAIL_USERNAME:noreply@serendipitycoop.it}}
    subject-prefix: ${APP_NOTIFICATIONS_SUBJECT_PREFIX:Serendipity}
